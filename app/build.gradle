import java.util.Properties

plugins {
    id 'com.android.application'
}

// Credentials and keystore remain outside source control.
def signingFile = System.getenv('ECHO_SIGNING_PROPERTIES') ? new File(System.getenv('ECHO_SIGNING_PROPERTIES')) : rootProject.file('keystore.properties')
def releaseSigning = null
if (signingFile.isFile()) {
    releaseSigning = new Properties()
    signingFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'com.klob.echo'
    compileSdk 37

    defaultConfig {
        applicationId "com.klob.echo"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdk 30
        targetSdk 37
        versionCode 20
        versionName "2.3.0"
    }

    signingConfigs {
        if (releaseSigning != null) {
            release {
                storeFile new File(signingFile.parentFile, releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFile file('proguard-rules.pro')
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            if (releaseSigning != null) signingConfig signingConfigs.release
        }

    }
    lint {
        abortOnError true
        disable "ExpiredTargetSdkVersion"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'io.github.jaredmdobson:concentus:1.0.2'
    implementation 'org.gagravarr:vorbis-java-core:0.8'
    implementation 'com.alphacephei:vosk-android:0.3.75'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'org.maplibre.gl:android-sdk-opengl:13.7.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
